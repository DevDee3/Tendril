services:
  falkordb:
    image: falkordb/falkordb:v4.20.4
    container_name: tendril-falkordb
    ports:
      - "6379:6379"
      - "${FALKORDB_BROWSER_PORT:-3002}:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  tendril-api:
    build: .
    container_name: tendril-api
    environment:
      NODE_ENV: production
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      TENDRIL_GRAPH: tendril
      TENDRIL_API_PORT: 8787
      TENDRIL_API_TOKEN: ${TENDRIL_API_TOKEN:?Set TENDRIL_API_TOKEN in .env}
      TENDRIL_ALLOWED_ORIGINS: ${TENDRIL_ALLOWED_ORIGINS:-http://localhost:3000}
      # Inside Compose, localhost refers to this container. Always use the
      # FalkorDB service name for the shared Redis-compatible rate limiter.
      TENDRIL_RATE_LIMIT_REDIS_URL: redis://falkordb:6379
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      falkordb:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: tendril-frontend
    environment:
      NODE_ENV: production
      TENDRIL_API_URL: http://tendril-api:8787
      TENDRIL_API_TOKEN: ${TENDRIL_API_TOKEN:?Set TENDRIL_API_TOKEN in .env}
    ports:
      - "3000:3000"
    depends_on:
      tendril-api:
        condition: service_healthy
volumes:
  falkordb-data:
